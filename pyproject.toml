[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manga-pipeline"
version = "0.1.0"
description = "Japanese-to-Korean manga translation pipeline with PySide6 GUI"
requires-python = ">=3.10,<3.13"
authors = [{ name = "column" }]
license = { text = "GPL-3.0-or-later" }
readme = "README.md"

[project.scripts]
manga-pipeline = "manga_pipeline.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict_optional = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires CUDA GPU and downloaded model weights",
    "network: requires network access (model downloads, API calls)",
]
